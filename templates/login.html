<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <!-- The above 4 meta tags *must* come first in the head; any other head content must come *after* these tags -->

    <!-- Title  -->
    <title>Innov3DP</title>

    <!-- Favicon  -->
    <link rel="icon" href="static/img/core-img/favicon.ico" />

    <!-- Core Style CSS -->
    <link rel="stylesheet" href="static/css/core-style.css" />
    <link rel="stylesheet" href="static/style.css" />
  </head>

  <body>
        <nav class="navbar navbar-expand-md navbar-light bg-3 border">
                <button
                  aria-controls="navbar"
                  aria-expanded="false"
                  aria-label="Toggle navigation"
                  class="navbar-toggler"
                  data-target="#navbar"
                  data-toggle="collapse"
                  type="button"
                >
                  <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbar">
                  {% if session.user_id %}
                  <ul class="navbar-nav ml-auto mt-2">
                    <li class="nav-item">
                      Hi, {{session.user_id}}
                    </li>
                  </ul>
                  {% else %}
                  <ul class="navbar-nav ml-auto mt-2">
                    <li class="nav-item">
                      <a class="nav-link" href="/register">Register</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="/login">Log In</a></li>
                  </ul>
                  {% endif %}
                </div>
              </nav>
    <h4 class="text-center text-danger">{{ message }}</h4>
    <!-- Search Wrapper Area Start -->
    <div class="search-wrapper section-padding-100">
      <div class="search-close">
        <i class="fa fa-close" aria-hidden="true"></i>
      </div>
      <div class="container">
        <div class="row">
          <div class="col-12">
            <div class="search-content">
              <form action="#" method="get">
                <input
                  type="search"
                  name="search"
                  id="search"
                  placeholder="Type your keyword..."
                />
                <button type="submit">
                   <img src="static/img/core-img/search.png" alt="" />
                </button>
                
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Search Wrapper Area End -->

    <!-- ##### Main Content Wrapper Start ##### -->
    <div class="main-content-wrapper d-flex clearfix">
      <!-- Mobile Nav (max width 767px)-->
      <div class="mobile-nav">
        <!-- Navbar Brand -->
        <div class="amado-navbar-brand">
          <a href="{{ url_for('index') }}"
            ><img src="static/img/core-img/INNOV 3D (3).png" alt=""
          /></a>
        </div>
        <!-- Navbar Toggler -->
        <div class="amado-navbar-toggler">
          <span></span><span></span><span></span>
        </div>
      </div>

      <!-- Header Area Start -->
      <header class="header-area clearfix">
        <!-- Close Icon -->
        <div class="nav-close">
          <i class="fa fa-close" aria-hidden="true"></i>
        </div>
        <!-- Logo -->
        <div class="logo">
          <a href="{{ url_for('index') }}"
            ><img src="static/img/core-img/INNOV 3D (3).png" alt=""
          /></a>
        </div>
        <!-- Amado Nav -->
        <nav class="amado-nav">
          <ul>
            <li class="active"><a href="{{ url_for('index') }}">Home</a></li>
            <!--<li><a href="shop.html">Shop</a></li>-->
            <li><a href="{{ url_for('productDetails') }}">Product</a></li>
            <li><a href="{{ url_for('cart') }}">Cart</a></li>
            <li><a href="{{ url_for('checkout') }}">Checkout</a></li>
          </ul>
        </nav>
        <!-- Button Group -->
        <!--
            <div class="amado-btn-group mt-30 mb-100">
                <a href="#" class="btn amado-btn mb-15">%Discount%</a>
                <a href="#" class="btn amado-btn active">New this week</a>
            </div>
            -->
        <!-- Cart Menu -->
        <div class="cart-fav-search mb-100">
          <a href="{{ url_for('cart') }}" class="cart-nav"
            ><img src="static/img/core-img/cart.png" alt="" /> Cart
            </a
          >
          <a href="#" class="fav-nav"
            ><img src="static/img/core-img/favorites.png" alt="" /> Favourite</a
          >
          <a href="#" class="search-nav"
            ><img src="static/img/core-img/search.png" alt="" /> Search</a
          >
        </div>
        <!-- Social Button -->
        <div class="social-info d-flex justify-content-between">
          <a href="#"><i class="fa fa-pinterest" aria-hidden="true"></i></a>
          <a href="#"><i class="fa fa-instagram" aria-hidden="true"></i></a>
          <a href="#"><i class="fa fa-facebook" aria-hidden="true"></i></a>
          <a href="#"><i class="fa fa-twitter" aria-hidden="true"></i></a>
        </div>
      </header>
      <!-- Header Area End -->

      <!-- Product Catagories Area Start -->
      <div class="products-catagories-area clearfix">
        <div class="container h-100 d-flex justify-content-center">
            <div class="jumbotron my-auto">
              <h1>Login</h1>
              <form action="{{ url_for('login') }}" method="post">
                <div class="form-group">
                  <label for="exampleInputEmail1">Email</label>
                  <input
                    type="text"
                    class="form-control"
                    name="email"
                    placeholder="Enter email"
                  />
                </div>
                <div class="form-group">
                  <label for="exampleInputPassword1">Password</label>
                  <input
                    type="password"
                    class="form-control"
                    name="password"
                    placeholder="Password"
                  />
                </div>
                <div class="form-check">
                  
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
                <hr />
                <p>New to Innov3DP? <a href="/register" style="color:blue; font-family: sans-serif; font-size: 15px;" ><b>Register</b></a></p>
                  
            </form>
            </div>
          </div>
      <!-- Product Catagories Area End -->
    </div>
    <!-- ##### Main Content Wrapper End ##### -->

    <!-- ##### Newsletter Area Start ##### -->
    
          <!-- Single Widget Area -->
          <div class="col-12 col-lg-8">
            <div class="single_widget_area">
              <!-- Footer Menu -->
              <div class="footer_menu">
                <nav class="navbar navbar-expand-lg justify-content-end">
                  <button
                    class="navbar-toggler"
                    type="button"
                    data-toggle="collapse"
                    data-target="#footerNavContent"
                    aria-controls="footerNavContent"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                  >
                    <i class="fa fa-bars"></i>
                  </button>
                  <div class="collapse navbar-collapse" id="footerNavContent">
                    <ul class="navbar-nav ml-auto">
                      <li class="nav-item active">
                        <a class="nav-link" href="{{ url_for('index') }}"
                          >Home</a
                        >
                      </li>
                      <!--
                                        <li class="nav-item">
                                            <a class="nav-link" href="shop.html">Shop</a>
                                        </li>
                                        -->
                      <li class="nav-item">
                        <a
                          class="nav-link"
                          href="{{ url_for('productDetails') }}"
                          >Product</a
                        >
                      </li>
                      <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('cart') }}"
                          >Cart</a
                        >
                      </li>
                      <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('checkout') }}"
                          >Checkout</a
                        >
                      </li>
                    </ul>
                  </div>
                </nav>
              </div>
            </div>
          </div>
        </div>
      </div>
    </footer>
    <!-- ##### Footer Area End ##### -->

    <!-- ##### jQuery (Necessary for All JavaScript Plugins) ##### -->
    <script src="static/js/jquery/jquery-2.2.4.min.js"></script>
    <!-- Popper js -->
    <script src="static/js/popper.min.js"></script>
    <!-- Bootstrap js -->
    <script src="static/js/bootstrap.min.js"></script>
    <!-- Plugins js -->
    <script src="static/js/plugins.js"></script>
    <!-- Active js -->
    <script src="static/js/active.js"></script>
  </body>
</html>
